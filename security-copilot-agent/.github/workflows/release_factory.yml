name: Galt.ai Release Factory

on:
  push:
    tags:
      - 'v*' # Disparar solo en tags de versión (ej: v1.0.1)

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: WINDOWS BUILD (PyInstaller + Inno Setup)
  # ------------------------------------------------------------------
  build-windows:
    name: 🏗️ Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile EXE (PyInstaller)
        run: python build_windows.py

      - name: Compile Installer (Inno Setup)
        uses: Minionguyjosh/inno-setup-action@v1.2.2
        with:
          path: installer/setup.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v3
        with:
          name: GaltAI_Setup_Windows
          path: release/GaltAI_Setup_Windows.exe

  # ------------------------------------------------------------------
  # JOB 2: LINUX/MAC BUILD (Universal Source Tarball)
  # ------------------------------------------------------------------
  build-linux-mac:
    name: 🐧🍎 Build Linux/Mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create Tarball
        run: |
          # Empaquetar fuentes, requirements y script de instalación
          tar -czvf GaltAI_LinuxMac.tar.gz *.py requirements.txt install.sh .env.example

      - name: Upload Linux/Mac Artifact
        uses: actions/upload-artifact@v3
        with:
          name: GaltAI_LinuxMac
          path: GaltAI_LinuxMac.tar.gz

  # ------------------------------------------------------------------
  # JOB 3: CREATE RELEASE
  # ------------------------------------------------------------------
  release:
    name: 🚀 Publish Release
    needs: [build-windows, build-linux-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Windows Artifact
        uses: actions/download-artifact@v3
        with:
          name: GaltAI_Setup_Windows
          
      - name: Download Linux/Mac Artifact
        uses: actions/download-artifact@v3
        with:
          name: GaltAI_LinuxMac

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            GaltAI_Setup_Windows.exe
            GaltAI_LinuxMac.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
