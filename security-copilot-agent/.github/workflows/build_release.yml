name: Build & Release Galt.ai

on:
  push:
    branches:
      - "main" # Ejecutar CI (Build) en cada push a main
    tags:
      - 'v*' # Ejecutar CD (Release) cuando subes un tag (ej: v2.0)

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile EXE
        run: python build_windows.py

      - name: Compile Installer (Inno Setup)
        uses: Minionguyjosh/inno-setup-action@v1.2.2
        with:
          path: installer/galt_setup.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: GaltAI_Setup_Windows
          path: release/GaltAI_Setup_v*.exe

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Windows Artifact
        uses: actions/download-artifact@v3
        with:
          name: GaltAI_Setup_Windows

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            GaltAI_Setup_v*.exe
            install.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
