<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galt Security - Portal de Acceso</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/styles.css">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: {
                            400: '#FDB022',
                            500: '#F59E0B',
                            600: '#D97706',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body
    class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <!-- Background Pattern -->
    <div
        class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZyBmaWxsPSJub25lIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxwYXRoIGQ9Ik0zNiAxOGMtMy4zMTQgMC02IDIuNjg2LTYgNnMyLjY4NiA2IDYgNiA2LTIuNjg2IDYtNi0yLjY4Ni02LTYtNnoiIHN0cm9rZT0iIzFmMjkzNyIgc3Ryb2tlLXdpZHRoPSIxIiBvcGFjaXR5PSIuMiIvPjwvZz48L3N2Zz4=')] opacity-20">
    </div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md">

        <!-- Logo/Brand -->
        <div class="text-center mb-8 animate-fade-in">
            <div class="inline-block bg-gradient-to-br from-blue-500 to-blue-700 p-4 rounded-2xl shadow-2xl mb-4">
                <svg class="w-16 h-16 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                    </path>
                </svg>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2">Galt Security</h1>
            <p class="text-slate-400">Portal de Distribución Alpha</p>
        </div>

        <!-- Login Form Card -->
        <div
            class="bg-slate-800/50 backdrop-blur-xl rounded-3xl shadow-2xl border border-slate-700/50 p-8 animate-slide-up">

            <form id="login-form" class="space-y-6">

                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-300 mb-2">
                        Correo Electrónico
                    </label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                        class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                        placeholder="usuario@ejemplo.com">
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300 mb-2">
                        Contraseña
                    </label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200"
                        placeholder="••••••••">
                </div>

                <!-- Error Message -->
                <div id="error-message" class="hidden bg-red-500/10 border border-red-500/50 rounded-xl p-4">
                    <p class="text-red-400 text-sm flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd"
                                d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                                clip-rule="evenodd"></path>
                        </svg>
                        <span id="error-text"></span>
                    </p>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="login-btn"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transform hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-800">
                    Ingresar
                </button>

            </form>

            <!-- Footer Note -->
            <div class="mt-6 pt-6 border-t border-slate-700/50">
                <p class="text-center text-sm text-slate-400">
                    🔒 Acceso restringido solo para usuarios autorizados
                </p>
            </div>

        </div>

        <!-- Version Info -->
        <div class="text-center mt-6">
            <p class="text-slate-500 text-sm">Galt Portal v0.1 - Alpha</p>
        </div>

    </div>

    <!-- Login Script -->
    <script type="module">
        import { login, redirectIfAuthenticated } from './js/auth.js';

        // Redirect if already logged in
        redirectIfAuthenticated();

        // Handle login form submission
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Hide error message
            errorMessage.classList.add('hidden');

            // Show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="inline-block animate-spin mr-2">⏳</span> Ingresando...';

            try {
                const result = await login(email, password);

                if (result.success) {
                    // Success! Redirect to dashboard
                    loginBtn.innerHTML = '✓ Acceso concedido';
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 500);
                } else {
                    // Show error
                    errorText.textContent = result.error;
                    errorMessage.classList.remove('hidden');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Ingresar';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorText.textContent = 'Error inesperado. Intenta nuevamente.';
                errorMessage.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Ingresar';
            }
        });
    </script>

</body>

</html>
